# ============================================
# APPLICATION CONFIGURATION
# ============================================
spring.application.name=backend-electro

# Port du serveur (par défaut 8080)
server.port=8080

# Préfixe pour toutes les routes : /api
server.servlet.context-path=/api


# ============================================
# DATABASE CONFIGURATION (PostgreSQL)
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/bd_electro
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================
# JPA / HIBERNATE CONFIGURATION
# ============================================

# IMPORTANT : validate car les tables ont été créées manuellement avec SQL
# validate = Hibernate vérifie que les entités correspondent aux tables SANS les modifier
spring.jpa.hibernate.ddl-auto=update

# Afficher les requêtes SQL dans la console (utile pour le debug)
spring.jpa.show-sql=true

# Formater les requêtes SQL pour une meilleure lisibilité
spring.jpa.properties.hibernate.format_sql=true

# Dialecte PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Afficher les paramètres des requêtes (très utile pour le debug)
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Stratégie de nommage : utilise les noms exacts des colonnes
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


# ============================================
# JACKSON CONFIGURATION (JSON)
# ============================================

# Format de date par défaut pour JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Africa/Douala

# Ne pas échouer sur des propriétés JSON inconnues
spring.jackson.deserialization.fail-on-unknown-properties=false

# Inclure les valeurs nulles dans le JSON (ou false pour les exclure)
spring.jackson.default-property-inclusion=non_null


# ============================================
# LOGGING CONFIGURATION
# ============================================

# Niveau de log global
logging.level.root=INFO

# Niveau de log pour ton application
logging.level.com.electro.bdelectro=DEBUG

# Niveau de log pour Spring
logging.level.org.springframework.web=DEBUG


# ============================================
# ERROR HANDLING
# ============================================

# Inclure le message d'erreur dans la réponse
server.error.include-message=always

# Inclure la stacktrace dans la réponse (only pour dev, never en prod)
server.error.include-stacktrace=on_param

# Inclure les détails de l'exception
server.error.include-exception=true


# ============================================
# PERFORMANCE & CONNECTION POOL
# ============================================

# HikariCP (pool de connexions) - Configuration optimale
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


